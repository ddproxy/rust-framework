[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# The list is shared with dependency-review-action; allowances unused here stay allowed.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
# Upstream crates pull both majors and nothing here can unify them: tracing-attributes is on syn 2
# while the serde, clap and tokio derives are on syn 3; tokio reaches windows-sys 0.52 through
# errno and 0.61 through mio. Re-check when these are bumped.
skip = [
    { crate = "syn@2", reason = "tracing-attributes on syn 2, derives on syn 3" },
    { crate = "windows-sys@0.52", reason = "errno (via tokio) on 0.52, mio (via tokio) on 0.61" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# No git dependencies today; the org entry is the policy for future ones.
unused-allowed-org = "allow"

[sources.allow-org]
github = ["ddproxy"]
