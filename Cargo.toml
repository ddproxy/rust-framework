[workspace]
members = ["crates/fw-config", "crates/fw-auth", "crates/fw-serve", "crates/fw-tui", "app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
publish = false

# Versions and default features live here; each crate opts into the features it uses.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2"
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
sha2 = "0.10"
tokio = { version = "1", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false }
tower-service = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi", "json"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "crossterm_0_29"] }
crossterm = "0.29"
libc = "0.2"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
x509-parser = "0.18"
time = { version = "0.3", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# Panic must unwind so drop guards (the TUI terminal restore) run.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
